name: Update vehicle feed

on:
  schedule:
    # Runs every day at 9:00 UTC (about 4-5 AM Eastern)
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # also lets you run it manually with one click

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Build the feed from the live website
        run: python build_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.csv last_updated.txt
          git diff --cached --quiet || git commit -m "Daily feed update"
          git push
